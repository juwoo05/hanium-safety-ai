spring.application.name=hanium-safety-ai

server.tomcat.uri-encoding=UTF-8

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=jdbc:mariadb://<host>:3306/<database>?useSSL=true&trustServerCertificate=true
spring.datasource.username=<db-username>
spring.datasource.password=<db-password>
spring.jpa.hibernate.ddl-auto=update
INTERNAL_API_KEY=<internal-api-key>


#email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<mail-username>
spring.mail.password=<mail-app-password>
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# FastAPI AI
ai-pipeline.base-url=http://localhost:8000
ai-pipeline.api-key=${INTERNAL_API_KEY}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
