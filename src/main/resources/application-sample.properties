spring.application.name=hanium-safety-ai

server.tomcat.uri-encoding=UTF-8

spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

spring.datasource.url=jdbc:mariadb://<host>:3306/<database>?useSSL=true&requireSSL=true
spring.datasource.username=<db-username>
spring.datasource.password=<db-password>
spring.jpa.hibernate.ddl-auto=update
INTERNAL_API_KEY=<internal-api-key>


#email
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=<mail-username>
spring.mail.password=<mail-app-password>
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000


# FastAPI AI
ai-pipeline.base-url=http://localhost:8000
ai-pipeline.api-key=${INTERNAL_API_KEY}

# KISCON 건설업체정보 서비스 (공공데이터포털)
kiscon.base-url=https://apis.data.go.kr/1613000/ConAdminInfoSvc1
kiscon.service-key=<kiscon-service-key>

# MSDS/SDS 검색 공급자: mock(데모 내장 목록) | kosha(OpenAPI 연동, 아직 미구현)
# KOSHA 사이트 직접 크롤링은 하지 않고, mock은 KOSHA MSDS 상세 페이지로 연결되는 "참고자료" 링크만 만든다.
msds.provider=mock
# 검색 결과의 "KOSHA MSDS" 링크가 이동할 안전보건공단 MSDS 상세 페이지
msds.kosha.detail-url=https://msds.kosha.or.kr/MSDSInfo/kcic/msdsdetail.do
msds.kosha.base-url=<kosha-msds-openapi-base-url>
msds.kosha.service-key=<kosha-msds-openapi-service-key>

# 기상청 API허브(apihub.kma.go.kr) 단기예보 - 대시보드 날씨 위젯
weather.api.base-url=https://apihub.kma.go.kr/api/typ02/openApi/VilageFcstInfoService_2.0
weather.api.key=<weather-service-key>
weather.api.nx=60
weather.api.ny=127

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
